<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente de Fondo Vibrante Naranja L'OLLETA -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e1d" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Sombra suave interior -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7c2d12" flood-opacity="0.35" />
    </filter>

    <!-- Gradiente de la Olleta / Olla -->
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Gradiente del contenido de la olla / caldo dorado -->
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Círculo contenedor con esquinas redondeadas modernas (Squircle / App Icon) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" />

  <!-- Borde exterior sutil -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#fed7aa" stroke-width="2.5" opacity="0.4" />

  <g filter="url(#shadow)">
    <!-- Vapor caliente ascendente (3 ondas estilizadas) -->
    <!-- Onda izquierda -->
    <path d="M 44 42 C 41 34, 49 26, 44 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <!-- Onda central -->
    <path d="M 64 38 C 60 28, 70 20, 64 12" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Onda derecha -->
    <path d="M 84 42 C 81 34, 89 26, 84 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

    <!-- Asas de la Olleta (Izquierda y Derecha) -->
    <!-- Asa izquierda -->
    <path d="M 28 66 C 20 66, 18 78, 28 84" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
    <!-- Asa derecha -->
    <path d="M 100 66 C 108 66, 110 78, 100 84" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />

    <!-- Tapa / Borde superior de la Olla -->
    <ellipse cx="64" cy="56" rx="38" ry="11" fill="url(#potGrad)" stroke="#7c2d12" stroke-width="1.5" />
    <!-- Interior de comida / sopa humeante -->
    <ellipse cx="64" cy="56" rx="31" ry="7" fill="url(#soupGrad)" />

    <!-- Cuerpo de la Olleta tradicional (Curvado y robusto) -->
    <path d="M 27 56 C 25 86, 38 108, 64 108 C 90 108, 103 86, 101 56 Z" fill="url(#potGrad)" />

    <!-- Detalle decorativo central en la olla (Plato / Cubiertos sutiles) -->
    <path d="M 42 74 Q 64 88 86 74" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <circle cx="64" cy="94" r="4.5" fill="#ea580c" opacity="0.85" />
  </g>
</svg>
